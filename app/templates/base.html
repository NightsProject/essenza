<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Essenza — Extreme Text Summarization{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{{ url_for('index') }}" class="site-title">Essenza</a>
            <nav class="site-nav">
                <a href="{{ url_for('index') }}">Summarizer</a>
                <a href="{{ url_for('methodology') }}">Methodology</a>
                <a href="{{ url_for('about') }}">About</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Essenza — Extreme Text Summarization Research Demo</p>
            <p class="footer-meta">FLAN-T5-small | Fine-tuned for information-preserving compression</p>
        </div>
    </footer>

    <script src="{{ url_for('static', path='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
